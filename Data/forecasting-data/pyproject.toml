[project]
name = "it2047-forecasting-analysis"
version = "0.1.0"
description = "Notebook environment for analyzing and preparing the IT2047 house-price dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
]

[tool.uv]
package = false
